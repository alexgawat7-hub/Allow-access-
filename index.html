<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Allow Access — Privacy First</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#243b62,#101827 55%);color:#eef4ff;font:16px/1.6 system-ui,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,6vw,52px);border:1px solid #ffffff24;border-radius:24px;background:#17243bdc;box-shadow:0 24px 80px #0006}
    .mark{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:#274d78;color:#a9d8ff;font-size:26px}
    h1{margin:24px 0 10px;font-size:clamp(30px,7vw,44px);line-height:1.1}p{color:#c2cee0}
    .note{margin-top:26px;padding:16px;border-left:3px solid #65b6ff;background:#ffffff0b;border-radius:8px;color:#dbe8f8;font-size:14px}
    footer{margin-top:28px;color:#8193ad;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Welcome</h1>
    <p>This is a privacy-first information page. No camera, microphone, or location access is requested by this website.</p>
    <div class="note">Your device permissions remain under your control. Only share information when you understand what is being collected and have chosen to provide it.</div>
    <footer>Privacy-first demo site</footer>
  </main>
</body>
</html>
